<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CodeSponge - Editor</title>
<link rel="stylesheet" href="style.css"/>
<style>
html, body { height: 100%; overflow: hidden; }
.editor-layout { display: flex; flex-direction: column; height: 100vh; }

.editor-topbar {
  height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px; flex-shrink: 0;
}
.topbar-brand { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; margin-right: 4px; }
.topbar-brand span { color: var(--accent); }
.topbar-sep { color: var(--border); font-size: 20px; font-weight: 200; }
.project-title-input {
  background: none; border: none; color: var(--text);
  font-size: 14px; font-weight: 600; font-family: var(--font);
  outline: none; max-width: 200px;
  border-bottom: 1px solid transparent;
  padding: 2px 0;
  transition: border-color .15s;
}
.project-title-input:focus { border-bottom-color: var(--accent); }
.topbar-spacer { flex: 1; }
.save-indicator { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.save-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success); flex-shrink: 0;
  transition: background .2s;
}
.save-dot.saving { background: #e3b341; }
.save-dot.error  { background: var(--danger); }
.lang-select-wrap select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  cursor: pointer;
}
.lang-select-wrap select:focus { border-color: var(--accent); }
.run-btn {
  background: var(--success);
  color: #0d1117;
  font-weight: 700;
  padding: 6px 16px;
  font-size: 13px;
}
.run-btn:hover { background: #46c55a; }
.run-btn:disabled { opacity: .6; }

.editor-body { display: flex; flex: 1; overflow: hidden; position: relative; }
.editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#monaco-editor { flex: 1; }

#loading-overlay {
  position: absolute;
  top: 0; left: 0; right: 360px; bottom: 0;
  background: var(--surface);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; z-index: 10;
}
.spin {
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-msg  { font-size: 13px; color: var(--muted); margin: 0; }
#loading-hint { font-size: 11px; color: var(--muted); opacity: 0; transition: opacity .5s; margin: 0; }
#loading-hint.show { opacity: 1; }

.output-pane {
  width: 360px; flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  background: var(--surface);
}
.output-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.output-tab {
  padding: 9px 16px;
  font-size: 12px; font-weight: 600; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: color .15s;
}
.output-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.output-body { flex: 1; overflow-y: auto; padding: 16px; }
#output {
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 13px; white-space: pre-wrap;
  color: var(--success); line-height: 1.7;
  min-height: 60px; margin: 0;
}
#output.has-error { color: var(--danger); }
#output.idle { color: var(--muted); }
#html-preview { flex: 1; border: none; background: #fff; display: none; }
.output-toolbar {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; flex-shrink: 0;
}

.status-bar {
  height: 24px; background: var(--accent);
  display: flex; align-items: center;
  padding: 0 14px; gap: 20px; flex-shrink: 0;
}
.status-item { font-size: 11px; color: rgba(255,255,255,.85); display: flex; align-items: center; gap: 5px; }
.status-right { margin-left: auto; display: flex; gap: 20px; }

.modal { padding: 28px; }
.modal h2 { font-size: 17px; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.share-input-wrap { display: flex; gap: 8px; }
.share-input-wrap input { flex: 1; font-size: 13px; }
</style>
</head>
<body>
<div class="editor-layout">

  <div class="editor-topbar">
    <a href="dashboard.html" class="btn btn-ghost" style="padding:5px 10px;font-size:13px">Back</a>
    <div class="topbar-sep">/</div>
    <div class="topbar-brand">
      <span style="width:22px;height:22px;border-radius:5px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0">CS</span>
      Code<span>Sponge</span>
    </div>
    <div class="topbar-sep">/</div>
    <input class="project-title-input" id="project-title" value="Loading..." onblur="renameProject()" onkeydown="if(event.key==='Enter')this.blur()"/>
    <div class="topbar-spacer"></div>
    <div class="save-indicator">
      <div class="save-dot" id="save-dot"></div>
      <span id="save-status">Saved</span>
    </div>
    <div class="lang-select-wrap">
      <select id="lang-select" onchange="changeLanguage(this.value)">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="cpp">C++</option>
        <option value="html">HTML</option>
      </select>
    </div>
    <button class="btn btn-ghost" style="padding:5px 12px;font-size:13px" onclick="shareSnippet()">Share</button>
    <button class="btn run-btn" id="run-btn" onclick="runCode()">&#9654; Run</button>
  </div>

  <div class="editor-body">
    <div id="loading-overlay">
      <div class="spin"></div>
      <p id="loading-msg">Loading project...</p>
      <p id="loading-hint">Server is starting up, please wait up to 30 seconds...</p>
    </div>

    <div class="editor-pane">
      <div id="monaco-editor"></div>
    </div>

    <div class="output-pane">
      <div class="output-tabs">
        <div class="output-tab active" id="tab-output" onclick="switchTab('output')">Output</div>
        <div class="output-tab" id="tab-preview" onclick="switchTab('preview')" style="display:none">Preview</div>
      </div>
      <div class="output-body" id="output-body">
        <pre id="output" class="idle">Press Run or Ctrl+Enter to run your code...</pre>
      </div>
      <iframe id="html-preview"></iframe>
      <div class="output-toolbar">
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="clearOutput()">Clear</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-item">CodeSponge</div>
    <div class="status-item" id="status-lang">Python</div>
    <div class="status-right">
      <div class="status-item">Ctrl+Enter: Run</div>
      <div class="status-item">Ctrl+S: Save</div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="share-modal">
  <div class="modal">
    <h2>Share snippet</h2>
    <p class="modal-sub">Anyone with this link can view and run your code.</p>
    <div class="share-input-wrap">
      <input id="share-link" type="text" readonly onclick="this.select()"/>
      <button class="btn btn-primary" id="copy-btn" onclick="copyShareLink()">Copy</button>
    </div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn btn-ghost" onclick="document.getElementById('share-modal').classList.remove('open')">Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script>
var API   = "https://codesponge-backend.onrender.com";
var token = localStorage.getItem("token");
if (!token) window.location.href = "index.html";

var params    = new URLSearchParams(window.location.search);
var projectId = params.get("project");
if (!projectId && !params.get("snippet")) window.location.href = "dashboard.html";

function authH() {
  return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
}

var editor, currentLang = "python";

require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs" } });

require(["vs/editor/editor.main"], function() {
  editor = monaco.editor.create(document.getElementById("monaco-editor"), {
    value: "",
    language: "python",
    theme: "vs-dark",
    fontSize: 14,
    minimap: { enabled: false },
    automaticLayout: true,
    scrollBeyondLastLine: false,
    padding: { top: 14, bottom: 14 },
    cursorBlinking: "smooth",
    smoothScrolling: true,
  });

  var saveTimer;
  editor.onDidChangeModelContent(function() {
    clearTimeout(saveTimer);
    setSaveStatus("saving");
    saveTimer = setTimeout(saveProject, 1500);
  });

  loadProject();
});

function hideOverlay() {
  var el = document.getElementById("loading-overlay");
  el.style.transition = "opacity 0.3s";
  el.style.opacity = "0";
  setTimeout(function() { el.style.display = "none"; }, 300);
}

function setSaveStatus(state) {
  var dot = document.getElementById("save-dot");
  var txt = document.getElementById("save-status");
  if (state === "saving")     { dot.className = "save-dot saving"; txt.textContent = "Saving..."; }
  else if (state === "saved") { dot.className = "save-dot";        txt.textContent = "Saved"; }
  else                        { dot.className = "save-dot error";  txt.textContent = "Save failed"; }
}

async function loadProject() {
  var snippet = params.get("snippet");
  if (snippet) { loadSnippet(snippet); return; }

  var hintTimer = setTimeout(function() {
    document.getElementById("loading-hint").classList.add("show");
  }, 6000);

  for (var attempt = 0; attempt < 3; attempt++) {
    try {
      if (attempt > 0) {
        document.getElementById("loading-msg").textContent = "Retrying... (" + (attempt + 1) + "/3)";
        await new Promise(function(r) { setTimeout(r, 2000); });
      }

      var res = await fetch(API + "/projects/" + projectId, { headers: authH() });
      clearTimeout(hintTimer);

      if (res.status === 401) { window.location.href = "index.html"; return; }
      if (!res.ok) throw new Error("HTTP " + res.status);

      var data = await res.json();
      document.title = data.name + " - CodeSponge";
      document.getElementById("project-title").value = data.name;
      document.getElementById("lang-select").value   = data.language;
      setLanguage(data.language);
      editor.setValue(data.code || getDefaultCode(data.language));
      setSaveStatus("saved");
      hideOverlay();
      return;

    } catch(err) {
      console.error("Load attempt " + (attempt+1) + " failed:", err);
    }
  }

  clearTimeout(hintTimer);
  document.getElementById("project-title").value = "Error loading";
  document.getElementById("loading-msg").textContent = "Could not load project.";
  document.getElementById("loading-hint").textContent = "Check your connection and refresh the page.";
  document.getElementById("loading-hint").classList.add("show");
  setTimeout(hideOverlay, 2000);
}

async function loadSnippet(id) {
  try {
    var res  = await fetch(API + "/snippets/" + id);
    var data = await res.json();
    document.getElementById("lang-select").value = data.language;
    setLanguage(data.language);
    editor.setValue(data.code);
    document.getElementById("save-status").textContent = "Shared snippet (read-only)";
    document.getElementById("save-dot").style.display  = "none";
    hideOverlay();
  } catch(e) {
    alert("Could not load snippet.");
    hideOverlay();
  }
}

async function saveProject() {
  if (params.get("snippet")) return;
  try {
    var r = await fetch(API + "/projects/" + projectId, {
      method: "PUT",
      headers: authH(),
      body: JSON.stringify({ code: editor.getValue(), language: currentLang })
    });
    setSaveStatus(r.ok ? "saved" : "error");
  } catch(e) { setSaveStatus("error"); }
}

async function renameProject() {
  if (params.get("snippet")) return;
  var name = document.getElementById("project-title").value.trim();
  if (!name) return;
  document.title = name + " - CodeSponge";
  try {
    await fetch(API + "/projects/" + projectId, {
      method: "PUT",
      headers: authH(),
      body: JSON.stringify({ code: editor.getValue(), language: currentLang, name: name })
    });
  } catch(e) {}
}

function changeLanguage(lang) {
  setLanguage(lang);
  editor.setValue(getDefaultCode(lang));
  saveProject();
}

function setLanguage(lang) {
  currentLang = lang;
  var monacoLang = { cpp: "cpp", javascript: "javascript", python: "python", html: "html" };
  monaco.editor.setModelLanguage(editor.getModel(), monacoLang[lang] || "plaintext");
  var labels = { python: "Python", javascript: "JavaScript", cpp: "C++", html: "HTML" };
  document.getElementById("status-lang").textContent = labels[lang] || lang;
  var isHtml = (lang === "html");
  document.getElementById("tab-preview").style.display = isHtml ? "" : "none";
  switchTab(isHtml ? "preview" : "output");
}

function switchTab(tab) {
  var isOutput = (tab === "output");
  document.getElementById("tab-output").className  = "output-tab" + (isOutput  ? " active" : "");
  document.getElementById("tab-preview").className = "output-tab" + (!isOutput ? " active" : "");
  document.getElementById("output-body").style.display    = isOutput ? ""     : "none";
  document.getElementById("html-preview").style.display   = isOutput ? "none" : "flex";
  document.querySelector(".output-toolbar").style.display = isOutput ? ""     : "none";
}

async function runCode() {
  var code = editor.getValue();
  var btn  = document.getElementById("run-btn");

  if (currentLang === "html") {
    document.getElementById("html-preview").srcdoc = code;
    switchTab("preview");
    return;
  }

  btn.disabled    = true;
  btn.textContent = "Running...";
  var out = document.getElementById("output");
  out.className   = "idle";
  out.textContent = "Running...";

  try {
    var res  = await fetch(API + "/run", {
      method: "POST",
      headers: authH(),
      body: JSON.stringify({ language: currentLang, code: code })
    });
    var data = await res.json();
    if (data.error && data.error.trim()) {
      out.textContent = data.error;
      out.className   = "has-error";
    } else {
      out.textContent = data.output || "(no output)";
      out.className   = "";
    }
  } catch(e) {
    out.textContent = "Could not connect to server.";
    out.className   = "has-error";
  } finally {
    btn.disabled    = false;
    btn.textContent = "Run";
  }
}

function clearOutput() {
  var out = document.getElementById("output");
  out.textContent = "Press Run or Ctrl+Enter to run your code...";
  out.className   = "idle";
}

async function shareSnippet() {
  try {
    var res  = await fetch(API + "/snippets", {
      method: "POST",
      headers: authH(),
      body: JSON.stringify({ language: currentLang, code: editor.getValue() })
    });
    var data = await res.json();
    var url  = location.origin + location.pathname + "?snippet=" + data.id;
    document.getElementById("share-link").value = url;
    document.getElementById("share-modal").classList.add("open");
  } catch(e) { alert("Could not create share link."); }
}

function copyShareLink() {
  navigator.clipboard.writeText(document.getElementById("share-link").value).catch(function() {
    document.getElementById("share-link").select();
    document.execCommand("copy");
  });
  var btn = document.getElementById("copy-btn");
  btn.textContent = "Copied!";
  setTimeout(function() { btn.textContent = "Copy"; }, 2000);
}

function getDefaultCode(lang) {
  var defaults = {
    python:     '# Python\nprint("Hello, World!")',
    javascript: '// JavaScript\nconsole.log("Hello, World!");',
    cpp:        '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, World!" << endl;\n    return 0;\n}',
    html:       '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: sans-serif; }\n  </style>\n</head>\n<body>\n  <h1>Hello, World!</h1>\n</body>\n</html>'
  };
  return defaults[lang] || "";
}

document.addEventListener("keydown", function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runCode(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "s")     { e.preventDefault(); saveProject(); }
  if (e.key === "Escape") document.getElementById("share-modal").classList.remove("open");
});
</script>
</body>
</html>
