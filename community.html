<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CodeSponge — Community</title>
<script src="ping.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
:root{--accent:#4f8ef7;--success:#3fb950;--danger:#f85149;--warning:#e3b341;--purple:#a371f7;--surface:#0d1117;--surface2:#161b22;--surface3:#1c2128;--surface4:#22272e;--border:rgba(255,255,255,.08);--text:#e6edf3;--muted:#7d8590;--mono:'JetBrains Mono',monospace}
.nav{height:56px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:8px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);font-weight:800;font-size:16px}
.brand-icon{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.brand-txt span{color:var(--accent)}
.nav-links{display:flex;gap:2px;margin-left:12px}
.nav-link{padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;transition:all .15s}
.nav-link:hover{color:var(--text);background:var(--surface3)}
.nav-link.active{color:var(--text);background:var(--surface3)}
.nav-sp{flex:1}
/* Hero */
.hero{background:var(--surface2);border-bottom:1px solid var(--border);padding:32px 0 26px}
.container{max-width:980px;margin:0 auto;padding:0 28px}
.hero h1{font-size:24px;font-weight:800;margin:0 0 4px}
.hero p{color:var(--muted);font-size:13px;margin:0}
/* Tabs */
.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:8px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
/* Controls row */
.controls{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{width:100%;background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px 8px 34px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.filter-sel{background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12px;font-family:'Inter',sans-serif;outline:none;cursor:pointer}
.filter-sel:focus{border-color:var(--accent)}
/* Body */
.body{padding:24px 0 60px}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
/* Post cards */
.post-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .1s;display:flex;flex-direction:column}
.post-card:hover{border-color:rgba(255,255,255,.18);box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(-2px)}
.post-code-preview{background:#1e1e1e;padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#d4d4d4;max-height:110px;overflow:hidden;position:relative;flex-shrink:0}
.post-code-preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:32px;background:linear-gradient(transparent,#1e1e1e)}
.post-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.post-header{display:flex;align-items:flex-start;gap:10px}
.post-icon{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.pi-python{background:rgba(53,114,165,.2);color:#79b8ff;border:1px solid rgba(53,114,165,.3)}
.pi-javascript{background:rgba(241,224,90,.12);color:#f1e05a;border:1px solid rgba(241,224,90,.2)}
.pi-cpp{background:rgba(243,75,125,.12);color:#f47fbf;border:1px solid rgba(243,75,125,.2)}
.pi-html{background:rgba(227,76,38,.12);color:#f4956a;border:1px solid rgba(227,76,38,.2)}
.pi-repo{background:rgba(163,113,247,.12);color:var(--purple);border:1px solid rgba(163,113,247,.2)}
.post-info{flex:1;min-width:0}
.post-title{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-author{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.post-author a{color:var(--accent);text-decoration:none;font-weight:600}
.post-author a:hover{text-decoration:underline}
.post-desc{font-size:12px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-footer{display:flex;align-items:center;gap:6px;margin-top:auto}
.post-stat{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:3px 9px;cursor:pointer;transition:all .15s;user-select:none}
.post-stat:hover{border-color:rgba(255,255,255,.2)}
.post-stat.liked{color:var(--danger);border-color:rgba(248,81,73,.3);background:rgba(248,81,73,.1)}
.post-stat-sep{flex:1}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.badge-lang{background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.badge-hosted{background:rgba(63,185,80,.12);color:var(--success);border:1px solid rgba(63,185,80,.25)}
/* Skeleton */
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:1200px 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}
.skel-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.skel-top{height:90px;background:var(--surface3)}
.skel-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty svg{opacity:.35;margin-bottom:14px}
.empty h3{font-size:15px;font-weight:700;color:var(--text);margin:0 0 5px}
.empty p{font-size:13px;margin:0}
/* Load more */
.load-more-wrap{text-align:center;margin-top:28px}
.load-more-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 24px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
.load-more-btn:hover{border-color:rgba(255,255,255,.2)}
.load-more-btn:disabled{opacity:.5;cursor:not-allowed}
/* Preview modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal-back.open{display:flex}
.modal-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;width:760px;max-width:100%;box-shadow:0 28px 80px rgba(0,0,0,.8);animation:mi .18s ease;overflow:hidden}
@keyframes mi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:20px 24px 16px;display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--border)}
.modal-icon{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.modal-title-wrap{flex:1;min-width:0}
.modal-title{font-size:18px;font-weight:800;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-author{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.modal-author a{color:var(--accent);text-decoration:none;font-weight:600}
.modal-close{background:var(--surface3);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;flex-shrink:0}
.modal-close:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.modal-desc{padding:16px 24px;font-size:13px;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--border)}
.modal-desc:empty{display:none}
.modal-code{background:#1e1e1e;padding:16px 20px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#d4d4d4;max-height:340px;overflow-y:auto;border-bottom:1px solid var(--border)}
.modal-footer{padding:16px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-stat{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.modal-stat-sep{flex:1}
.btn-prim{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px}
.btn-prim:hover{background:#6aa3f9}
.btn-prim:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px}
.btn-ghost:hover{border-color:rgba(255,255,255,.2)}
/* My posts tab highlighted */
#tab-mine{display:none}
/* Toast */
#toast{position:fixed;bottom:24px;right:20px;z-index:9999;border-radius:9px;padding:10px 16px;font-size:12px;font-family:'Inter',sans-serif;max-width:320px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>
</head>
<body>
<nav class="nav">
  <a href="dashboard.html" class="brand"><div class="brand-icon">CS</div><span class="brand-txt">Code<span>Sponge</span></span></a>
  <div class="nav-links">
    <a href="dashboard.html" class="nav-link">Projects</a>

<div class="hero">
  <div class="container">
    <h1>Community Hub</h1>
    <p>Discover, fork and share code projects from the CodeSponge community.</p>
    <div class="tabs">
      <div class="tab active" id="tab-trending" onclick="setTab('trending')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Trending
      </div>
      <div class="tab" id="tab-top" onclick="setTab('top')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        Top liked
      </div>
      <div class="tab" id="tab-recent" onclick="setTab('recent')">

<div class="body">
  <div class="container">
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="search-input" type="text" placeholder="Search by title, description or author..." oninput="debounceSearch()"/>
      </div>
      <select class="filter-sel" id="lang-filter" onchange="reload()">
        <option value="">All languages</option>

</div>

<!-- Preview modal -->
<div class="modal-back" id="preview-modal" onclick="if(event.target===this)closePreview()">
  <div class="modal-box">

      <div class="modal-icon" id="m-icon"></div>

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy code

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Share
      </button>
      <button class="btn-ghost" id="m-like-btn" onclick="likeFromModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span id="m-like-label">Like</span>

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        Fork &amp; open
      </button>

</div>

<div id="toast"></div>

<script>
var API   = "https://codesponge-backend.onrender.com";
var token = localStorage.getItem("token");
var email = localStorage.getItem("email")||"";
var username = localStorage.getItem("username")||"";
function authH(){return{"Content-Type":"application/json","Authorization":"Bearer "+(token||"")};}

// Show "My posts" tab if logged in
if(token)document.getElementById("tab-mine").style.display="flex";

// Apply saved accent colour
(function(){var ap=JSON.parse(localStorage.getItem("cs_appearance")||"{}");if(ap.accent)document.documentElement.style.setProperty("--accent",ap.accent);})();

var currentTab="trending", currentOffset=0, currentTotal=0, LIMIT=12;
var allPosts=[], openPostId=null;
var LANG_ICONS={python:"Py",javascript:"JS",cpp:"C++",html:"HTML"};
var ICON_CLASS={python:"pi-python",javascript:"pi-javascript",cpp:"pi-cpp",html:"pi-html"};

//  Toast 
var toastT;
function showToast(msg,type){
  var el=document.getElementById("toast");
  var c={success:{bg:"rgba(63,185,80,.18)",border:"rgba(63,185,80,.4)",color:"#3fb950"},error:{bg:"rgba(248,81,73,.18)",border:"rgba(248,81,73,.4)",color:"#f85149"},info:{bg:"rgba(79,142,247,.18)",border:"rgba(79,142,247,.4)",color:"#4f8ef7"}}[type]||{bg:"rgba(79,142,247,.18)",border:"rgba(79,142,247,.4)",color:"#4f8ef7"};
  el.style.cssText="position:fixed;bottom:24px;right:20px;z-index:9999;border-radius:9px;padding:10px 16px;font-size:12px;font-family:'Inter',sans-serif;max-width:320px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.4);background:"+c.bg+";border:1px solid "+c.border+";color:"+c.color+";display:block";
  el.textContent=msg;clearTimeout(toastT);
  toastT=setTimeout(function(){el.style.display="none";},3000);
}

//  Tabs 
function setTab(t){
  currentTab=t;currentOffset=0;
  ["trending","top","recent","mine"].forEach(function(x){
    var el=document.getElementById("tab-"+x);
    if(el)el.className="tab"+(x===t?" active":"");
  });
  reload();
}

//  Debounce search 
var searchDebounce;
function debounceSearch(){clearTimeout(searchDebounce);searchDebounce=setTimeout(function(){currentOffset=0;reload();},350);}

//  Load posts 
async function reload(){
  currentOffset=0;allPosts=[];
  showSkeletons();
  await fetchPosts(true);
}

function showSkeletons(){
  var g=document.getElementById("posts-grid");g.innerHTML="";
  for(var i=0;i<6;i++){
    var s=document.createElement("div");s.className="skel-card";
    s.innerHTML='<div class="skel-top"></div><div class="skel-body"><div class="skeleton" style="height:14px;width:70%"></div><div class="skeleton" style="height:11px;width:45%"></div><div class="skeleton" style="height:10px;width:90%"></div></div>';
    g.appendChild(s);
  }
}

async function fetchPosts(replace){
  var q=document.getElementById("search-input").value.trim();
  var lang=document.getElementById("lang-filter").value;
  var sort=currentTab==="trending"?"trending":currentTab==="top"?"top":"recent";
  var url=API+"/community?sort="+sort+"&limit="+LIMIT+"&offset="+currentOffset;
  if(q)url+="&q="+encodeURIComponent(q);
  if(lang)url+="&language="+encodeURIComponent(lang);
  if(currentTab==="mine"&&username)url=API+"/community?sort=recent&limit=50&offset=0&author="+encodeURIComponent(username);
  try{
    var headers=token?authH():{};
    var res=await fetch(url,{headers:headers});
    if(!res.ok)throw new Error("HTTP "+res.status);
    var data=await res.json();
    var posts=data.posts||[];
    currentTotal=data.total||posts.length;
    if(currentTab==="mine")posts=posts.filter(function(p){return p.username===username;});
    if(replace)allPosts=posts;else allPosts=allPosts.concat(posts);
    updateTabCounts(currentTotal);
    renderPosts();
  }catch(e){
    document.getElementById("posts-grid").innerHTML='<div class="empty"><h3>Could not load posts</h3><p>Check your connection. <a href="javascript:reload()" style="color:var(--accent)">Try again</a></p></div>';
  }
  document.getElementById("load-more-wrap").style.display=(allPosts.length<currentTotal&&currentOffset+LIMIT<currentTotal)?"":"none";
}

async function loadMore(){
  var btn=document.getElementById("load-more-btn");btn.disabled=true;btn.textContent="Loading...";
  currentOffset+=LIMIT;
  await fetchPosts(false);
  btn.disabled=false;btn.textContent="Load more";
}

//  Render posts 
function updateTabCounts(total){
  var label=currentTab==="trending"?"Trending":currentTab==="top"?"Top liked":currentTab==="recent"?"Recent":"My posts";
  var tabEl=document.getElementById("tab-"+currentTab);
  if(tabEl){
    // Update the active tab with count (just update text content beside the SVG)
    var spans=tabEl.querySelectorAll("span.tab-count");
    if(spans.length===0){
      var span=document.createElement("span");
      span.className="tab-count";
      span.style.cssText="font-size:10px;font-weight:700;background:var(--surface3);border:1px solid var(--border);border-radius:20px;padding:1px 6px;color:var(--muted);margin-left:2px";
      span.textContent=total>999?"999+":total;
      tabEl.appendChild(span);
    }else{
      spans[0].textContent=total>999?"999+":total;
    }
  }
}
function renderPosts(){
  var g=document.getElementById("posts-grid");g.innerHTML="";
  if(!allPosts.length){
    g.innerHTML='<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>No posts found</h3><p>Try a different search or filter, or be the first to publish!</p></div>';
    return;
  }
  allPosts.forEach(function(p){
    var card=document.createElement("div");card.className="post-card";
    var ptype=p.project_type||"single";
    var code=p.code_preview||"";
    var iconClass=ptype==="repo"?"pi-repo":(ICON_CLASS[p.language]||"pi-python");
    var iconText=ptype==="repo"?"Repo":(LANG_ICONS[p.language]||"?");
    var liked=p.liked_by_me;
    var ago=relTime(p.published_at);
    card.innerHTML=
      '<div class="post-code-preview">'+esc(code||"# no preview available")+'</div>'
      +'<div class="post-body">'
        +'<div class="post-header">'
          +'<div class="post-icon '+iconClass+'">'+iconText+'</div>'
          +'<div class="post-info">'
            +'<div class="post-title">'+esc(p.title)+'</div>'
            +'<div class="post-author">by <a href="#" onclick="event.stopPropagation()">'+esc(p.username||"unknown")+'</a> · '+ago+'</div>'
          +'</div>'
        +'</div>'
        +(p.description?'<div class="post-desc">'+esc(p.description)+'</div>':'')
        +'<div class="post-footer">'
          +'<div class="post-stat'+(liked?" liked":"")+" likes-btn-"+p.id+'" onclick="event.stopPropagation();toggleLike(\''+p.id+'\',this)">'
            +'<svg width="11" height="11" viewBox="0 0 24 24" fill="'+(liked?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
            +(p.likes||0)
          +'</div>'
          +'<div class="post-stat">'
            +'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
            +(p.views||0)
          +'</div>'
          +'<div class="post-stat" onclick="event.stopPropagation();forkPost(\''+p.id+'\',\''+esc(p.title)+'\',\''+(p.project_type||"single")+'\')">Fork</div>'
          +'<div class="post-stat-sep"></div>'
          +(p.language?'<span class="badge badge-lang">'+esc(p.language)+'</span>':'')
          +(p.hosted_url?'<span class="badge badge-hosted">Live</span>':'')
        +'</div>'
      +'</div>';
    card.addEventListener("click",function(){openPreview(p);});
    g.appendChild(card);
  });
}

function relTime(ts){var d=(Date.now()-new Date(ts).getTime())/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";if(d<2592000)return Math.floor(d/86400)+"d ago";return Math.floor(d/2592000)+"mo ago";}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

//  Like 
async function toggleLike(postId, btn){
  if(!token){showToast("Sign in to like posts","info");return;}
  try{
    var res=await fetch(API+"/community/"+postId+"/like",{method:"POST",headers:authH()});
    var data=await res.json();
    var p=allPosts.find(function(x){return x.id===postId;});
    if(p){p.likes=data.likes;p.liked_by_me=data.liked?1:0;}
    // Update all like buttons for this post
    document.querySelectorAll(".likes-btn-"+postId).forEach(function(el){
      el.className="post-stat"+(data.liked?" liked":"")+" likes-btn-"+postId;
      el.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="'+(data.liked?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'+(data.likes||0);
    });
    // Update modal if open
    if(openPostId===postId){
      document.getElementById("m-likes").textContent="\u2665 "+(data.likes||0)+" likes";
      document.getElementById("m-like-label").textContent=data.liked?"Liked":"Like";
      document.getElementById("m-like-btn").style.borderColor=data.liked?"rgba(248,81,73,.4)":"";
      document.getElementById("m-like-btn").style.color=data.liked?"#f85149":"";
    }
  }catch(e){showToast("Could not like post","error");}
}

//  Fork 
async function forkPost(postId,title,ptype){
  if(!token){showToast("Sign in to fork projects","info");return;}
  showToast("Forking '"+title+"'...","info");
  try{
    var res=await fetch(API+"/community/"+postId+"/fork",{method:"POST",headers:authH()});
    var data=await res.json();
    if(data.project_id){
      var target=(data.project_type==="repo"?"multifile.html":"editor.html")+"?project="+data.project_id;
      showToast("Forked! Opening project...","success");
      setTimeout(function(){window.location.href=target;},800);
    }else showToast(data.error||"Could not fork","error");
  }catch(e){showToast("Could not fork","error");}
}

//  Preview modal 
function openPreview(p){
  openPostId=p.id;
  var ptype=p.project_type||"single";
  var iconClass=ptype==="repo"?"pi-repo":(ICON_CLASS[p.language]||"pi-python");
  var iconText=ptype==="repo"?"Repo":(LANG_ICONS[p.language]||"?");
  document.getElementById("m-icon").className="modal-icon "+iconClass;
  document.getElementById("m-icon").textContent=iconText;
  document.getElementById("m-title").textContent=p.title;
  document.getElementById("m-author").innerHTML='by <a href="#">'+esc(p.username||"unknown")+'</a> · '+relTime(p.published_at)+(p.hosted_url?' · <a href="'+esc(p.hosted_url)+'" target="_blank" style="color:var(--success)"> View live</a>':'');
  document.getElementById("m-desc").textContent=p.description||"";
  document.getElementById("m-code").textContent=p.code_preview||(p.code||"");
  document.getElementById("m-likes").textContent="\u2665 "+(p.likes||0)+" likes";
  document.getElementById("m-views").textContent="\uD83D\uDC41 "+(p.views||0)+" views";
  document.getElementById("m-forks").textContent="\uD83C\uDF74 "+(p.forks||0)+" forks";
  var liked=p.liked_by_me;
  document.getElementById("m-like-label").textContent=liked?"Liked":"Like";
  document.getElementById("m-like-btn").style.borderColor=liked?"rgba(248,81,73,.4)":"";
  document.getElementById("m-like-btn").style.color=liked?"#f85149":"";
  document.getElementById("preview-modal").classList.add("open");
  document.body.style.overflow="hidden";
}
function closePreview(){document.getElementById("preview-modal").classList.remove("open");document.body.style.overflow="";openPostId=null;}
function likeFromModal(){if(openPostId)toggleLike(openPostId,null);}
function forkFromModal(){
  var p=allPosts.find(function(x){return x.id===openPostId;});
  if(p)forkPost(p.id,p.title,p.project_type||"single");
}
function copyPostCode(){
  var code=document.getElementById("m-code").textContent;
  if(!code){showToast("No code to copy","info");return;}
  navigator.clipboard.writeText(code).then(function(){
    var btn=document.getElementById("m-copy-code-btn");
    btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
    setTimeout(function(){btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy code';},2000);
  }).catch(function(){showToast("Could not copy","error");});
}
function sharePost(){
  var url=location.origin+location.pathname+"?post="+openPostId;
  navigator.clipboard.writeText(url).then(function(){showToast("Link copied to clipboard!","success");}).catch(function(){showToast("Could not copy link","error");});
}

document.addEventListener("keydown",function(e){if(e.key==="Escape")closePreview();});

//  Init 
// Check if URL has a ?post= param to open directly
(function(){
  var urlParams=new URLSearchParams(window.location.search);
  var postId=urlParams.get("post");
  if(postId){
    // Load the post and open preview
    fetch(API+"/community/"+postId,{headers:token?authH():{}}).then(function(r){return r.json();}).then(function(p){
      allPosts=[p];openPreview(p);
    }).catch(function(){});
  }
})();

reload();
</script>
