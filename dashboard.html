<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeSponge — Projects</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .topnav-brand { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .topnav-brand .icon { font-size: 20px; }
    .topnav-brand span { color: var(--accent); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #9b6fff);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .dash-hero {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      border-bottom: 1px solid var(--border);
      padding: 40px 0 36px;
    }
    .dash-hero-inner { max-width: 900px; margin: 0 auto; padding: 0 28px; }
    .dash-hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .dash-hero p  { color: var(--muted); font-size: 14px; }
    .dash-controls {
      display: flex; gap: 10px; align-items: center;
      margin-top: 24px; flex-wrap: wrap;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap input { padding-left: 38px; }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: 15px;
    }
    .filter-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      cursor: pointer;
    }
    .dash-body { max-width: 900px; margin: 32px auto; padding: 0 28px; }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .lang-colors { python: '#3572A5'; javascript: '#f1e05a'; cpp: '#f34b7d'; html: '#e34c26'; }
    .lang-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .lang-dot.python     { background: #3572A5; }
    .lang-dot.javascript { background: #f1e05a; }
    .lang-dot.cpp        { background: #f34b7d; }
    .lang-dot.html       { background: #e34c26; }
    .project-card {
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .1s;
    }
    .project-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 24px rgba(79,142,247,.08);
      transform: translateY(-2px);
    }
    .project-card-top { display: flex; align-items: flex-start; gap: 12px; }
    .project-card-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; background: var(--surface2); border: 1px solid var(--border);
    }
    .project-card-info { flex: 1; min-width: 0; }
    .project-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .project-card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .project-date { font-size: 12px; color: var(--muted); }
    .card-actions { display: flex; gap: 6px; }
    .new-card {
      border-style: dashed !important;
      flex-direction: column;
      align-items: center !important;
      justify-content: center;
      min-height: 148px;
      gap: 10px !important;
      color: var(--muted);
      font-size: 14px; font-weight: 600;
    }
    .new-card:hover { color: var(--accent) !important; }
    .new-card-plus {
      width: 40px; height: 40px; border-radius: 10px;
      border: 2px dashed currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; transition: border-color .15s;
    }
    .empty-full { grid-column: 1 / -1; }
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; }
    .modal select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      margin-top: 8px;
    }
    .modal select:focus { border-color: var(--accent); }
  </style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand">
    <span class="icon">🧽</span> Code<span>Sponge</span>
  </div>
  <div class="nav-right">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="avatar" id="nav-avatar">?</div>
      <span class="nav-email" id="nav-email"></span>
    </div>
    <button class="btn btn-ghost" onclick="logout()" style="font-size:13px;padding:7px 14px">Sign out</button>
  </div>
</nav>

<div class="dash-hero">
  <div class="dash-hero-inner">
    <h1>My Projects</h1>
    <p>Pick up where you left off, or start something new.</p>
    <div class="dash-controls">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="search-input" type="text" placeholder="Search projects…" oninput="filterProjects()"/>
      </div>
      <select class="filter-select" id="lang-filter" onchange="filterProjects()">
        <option value="">All languages</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="cpp">C++</option>
        <option value="html">HTML</option>
      </select>
      <button class="btn btn-primary" onclick="document.getElementById('new-modal').classList.add('open')">+ New project</button>
    </div>
  </div>
</div>

<div class="dash-body">
  <div class="section-label" id="project-count"></div>
  <div class="projects-grid" id="projects-grid"></div>
</div>

<!-- New Project Modal -->
<div class="modal-backdrop" id="new-modal">
  <div class="modal">
    <h2>New project</h2>
    <div class="form-group">
      <label style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Project name</label>
      <input id="proj-name" type="text" placeholder="My awesome project" style="margin-top:8px"/>
    </div>
    <div class="form-group" style="margin-top:14px">
      <label style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Language</label>
      <select id="proj-lang">
        <option value="python">🐍 Python</option>
        <option value="javascript">🟡 JavaScript</option>
        <option value="cpp">⚙️ C++</option>
        <option value="html">🌐 HTML</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="create-btn" onclick="createProject()">Create project</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-backdrop" id="del-modal">
  <div class="modal">
    <h2>Delete project?</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:4px">This action cannot be undone. All code in this project will be permanently deleted.</p>
    <div class="modal-actions">
      <button class="btn btn-danger" id="del-btn" onclick="confirmDelete()">Yes, delete</button>
      <button class="btn btn-ghost" onclick="document.getElementById('del-modal').classList.remove('open')">Cancel</button>
    </div>
  </div>
</div>

<script>
  const API   = "https://codesponge-backend.onrender.com";
  const token = localStorage.getItem("token");
  if (!token) window.location.href = "index.html";

  const email = localStorage.getItem("email") || "";
  document.getElementById("nav-email").textContent = email;
  document.getElementById("nav-avatar").textContent = email[0]?.toUpperCase() || "?";

  function logout() { localStorage.clear(); window.location.href = "index.html"; }
  function authH()  { return { "Content-Type": "application/json", "Authorization": "Bearer " + token }; }

  const LANG_ICONS = { python: "🐍", javascript: "🟡", cpp: "⚙️", html: "🌐" };

  let allProjects = [];

  async function loadProjects() {
    const grid = document.getElementById("projects-grid");
    grid.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:20px 0">Loading projects…</p>';
    try {
      const res = await fetch(API + "/projects", { headers: authH() });
      if (res.status === 401) { logout(); return; }
      allProjects = await res.json();
      filterProjects();
    } catch {
      grid.innerHTML = '<p style="color:var(--danger);font-size:14px;padding:20px 0">Could not load projects. Check your connection.</p>';
    }
  }

  function filterProjects() {
    const q    = document.getElementById("search-input").value.toLowerCase();
    const lang = document.getElementById("lang-filter").value;
    const filtered = allProjects.filter(p =>
      (!q    || p.name.toLowerCase().includes(q)) &&
      (!lang || p.language === lang)
    );
    renderGrid(filtered);
  }

  function renderGrid(list) {
    const grid  = document.getElementById("projects-grid");
    const count = document.getElementById("project-count");
    grid.innerHTML = "";

    // New project card
    const newCard = document.createElement("div");
    newCard.className = "project-card new-card";
    newCard.innerHTML = `<div class="new-card-plus">+</div><span>New project</span>`;
    newCard.onclick = () => document.getElementById("new-modal").classList.add("open");
    grid.appendChild(newCard);

    if (list.length === 0) {
      count.textContent = "0 projects";
      const empty = document.createElement("div");
      empty.className = "empty-full";
      empty.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div><h3>No projects found</h3><p>${allProjects.length === 0 ? "Create your first project to get started." : "Try a different search or filter."}</p></div>`;
      grid.appendChild(empty);
      return;
    }

    count.textContent = list.length + (list.length === 1 ? " project" : " projects");

    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "project-card";
      const date = new Date(p.updated_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      const icon = LANG_ICONS[p.language] || "📄";
      card.innerHTML = `
        <div class="project-card-top">
          <div class="project-card-icon">${icon}</div>
          <div class="project-card-info">
            <div class="project-name">${escHtml(p.name)}</div>
            <div class="project-meta">
              <span class="lang-dot ${p.language}"></span>
              <span class="lang-badge">${escHtml(p.language)}</span>
            </div>
          </div>
        </div>
        <div class="project-card-bottom">
          <span class="project-date">Updated ${date}</span>
          <div class="card-actions">
            <button class="btn btn-ghost" style="padding:5px 10px;font-size:12px" onclick="event.stopPropagation();openDelete('${p.id}')">Delete</button>
            <button class="btn btn-primary" style="padding:5px 12px;font-size:12px" onclick="openProject('${p.id}')">Open →</button>
          </div>
        </div>`;
      card.addEventListener("click", e => { if (!e.target.closest("button")) openProject(p.id); });
      grid.appendChild(card);
    });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function openProject(id) { window.location.href = `editor.html?project=${id}`; }

  function closeModal() {
    document.getElementById("new-modal").classList.remove("open");
    document.getElementById("proj-name").value = "";
  }

  async function createProject() {
    const name = document.getElementById("proj-name").value.trim() || "Untitled";
    const lang = document.getElementById("proj-lang").value;
    const btn  = document.getElementById("create-btn");
    btn.disabled = true; btn.textContent = "Creating…";
    try {
      const res  = await fetch(API + "/projects", { method: "POST", headers: authH(), body: JSON.stringify({ name, language: lang }) });
      const data = await res.json();
      closeModal();
      window.location.href = `editor.html?project=${data.id}`;
    } catch { alert("Could not create project."); }
    finally { btn.disabled = false; btn.textContent = "Create project"; }
  }

  let deleteId = null;
  function openDelete(id) { deleteId = id; document.getElementById("del-modal").classList.add("open"); }

  async function confirmDelete() {
    if (!deleteId) return;
    const btn = document.getElementById("del-btn");
    btn.disabled = true; btn.textContent = "Deleting…";
    try {
      await fetch(API + "/projects/" + deleteId, { method: "DELETE", headers: authH() });
      document.getElementById("del-modal").classList.remove("open");
      deleteId = null;
      allProjects = allProjects.filter(p => p.id !== deleteId);
      loadProjects();
    } catch { alert("Could not delete project."); }
    finally { btn.disabled = false; btn.textContent = "Yes, delete"; }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && document.getElementById("new-modal").classList.contains("open")) createProject();
    if (e.key === "Escape") { closeModal(); document.getElementById("del-modal").classList.remove("open"); }
  });

  loadProjects();
</script>
</body>
</html>
